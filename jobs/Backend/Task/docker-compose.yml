services:
  redis:
    image: redis:7
    container_name: exchange-rate-redis
    ports:
      - "6379:6379"
    volumes:
      - exchange-rate-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: ExchangeRateUpdater.Worker/Dockerfile
    image: exchange-rate-updater-worker:latest
    container_name:  exchange-rate-updater-worker
    environment:
      - Redis__Connection=redis:6379,abortConnect=false
      - ExchangeRateApiClientConfig__BaseUrl=https://api.cnb.cz/cnbapi/exrates/
    depends_on:
      - redis
    volumes:
      - shared-data:/shared
    healthcheck:
      test: [ "CMD", "sh", "-c", "test -f /shared/worker_ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: ExchangeRateUpdater.Api/Dockerfile
    image: exchange-rate-updater-api:latest
    container_name: exchange-rate-updater-api
    environment:
      - Redis__Connection=redis:6379,abortConnect=false
      - ExchangeRateApiClientConfig__BaseUrl=https://api.cnb.cz/cnbapi/exrates/
      - ApiDocumentation__Enabled=true
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
    depends_on:
      redis:
        condition: service_started
      worker:
        condition: service_healthy
    volumes:
      - shared-data:/shared
    ports:
      - "5001:80"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      
volumes:
  exchange-rate-redis-data:
  shared-data: